<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Settings setup preview</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap">
<style data-system>
/*
 * Personal Finance design system. The only source of colours, sizes and components.
 * Rules and how to change this file: docs/design-system/README.md
 */

/* ---------- Tokens ---------- */
:root {
  color-scheme: light;
  --bg: #F8F4EE; --surface: #FFFFFF; --surface-2: #F3EEE7; --sunk: #EADFD3;
  --line: #EBE4DB; --control: #8F8072;
  --ink: #1A0E08; --ink-2: #6A5C52;
  --accent: #BA3E0B; --accent-soft: #FDE9DC;
  --action: #1A0E08; --on-action: #FFF6EF;
  --earned: #9A8574; --spent: #E8500E;
  --gain: #1F7A3D; --gain-soft: #E5F2E8;
  --warn: #855500; --warn-soft: #F8ECD2;
  --danger: #B3261E; --on-danger: #FFFFFF; --danger-soft: #FBE5E1;
  --tip: #1A0E08; --on-tip: #FFF6EF;
  --shadow-ring: 0 0 0 1px rgba(20, 10, 5, .06);
  --shadow-card: 0 0 0 1px rgba(20, 10, 5, .05), 0 1px 2px rgba(20, 10, 5, .04), 0 18px 40px -28px rgba(80, 30, 5, .28);
  --shadow-pop: 0 0 0 1px rgba(20, 10, 5, .06), 0 16px 36px -8px rgba(80, 30, 5, .22);
  --rail: #1A0E08; --rail-2: #2A1309; --rail-ink: #FFF6EF; --rail-ink-2: #CDBBAD; --rail-line: rgba(255, 240, 228, .14); --rail-gain: #9BE3B2;
  --glow-1: #C2410C; --glow-2: #7A2306;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #140A05; --surface: #1F140D; --surface-2: #2A1C13; --sunk: #33231A;
    --line: #35271D; --control: #8C7B6E;
    --ink: #FFF6EF; --ink-2: #C4B4A7;
    --accent: #FF8A47; --accent-soft: #40200F;
    --action: #FFF6EF; --on-action: #1A0E08;
    --earned: #BCA795; --spent: #FF7A2E;
    --gain: #74D394; --gain-soft: #16301F;
    --warn: #EDBE63; --warn-soft: #3A2B12;
    --danger: #FF9C8A; --on-danger: #1A0E08; --danger-soft: #451C16;
    --tip: #FFF6EF; --on-tip: #1A0E08;
    --shadow-ring: 0 0 0 1px rgba(255, 240, 228, .08);
    --shadow-card: 0 0 0 1px rgba(255, 240, 228, .07);
    --shadow-pop: 0 0 0 1px rgba(255, 240, 228, .1), 0 16px 36px -8px rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #140A05; --surface: #1F140D; --surface-2: #2A1C13; --sunk: #33231A;
  --line: #35271D; --control: #8C7B6E;
  --ink: #FFF6EF; --ink-2: #C4B4A7;
  --accent: #FF8A47; --accent-soft: #40200F;
  --action: #FFF6EF; --on-action: #1A0E08;
  --earned: #BCA795; --spent: #FF7A2E;
  --gain: #74D394; --gain-soft: #16301F;
  --warn: #EDBE63; --warn-soft: #3A2B12;
  --danger: #FF9C8A; --on-danger: #1A0E08; --danger-soft: #451C16;
  --tip: #FFF6EF; --on-tip: #1A0E08;
  --shadow-ring: 0 0 0 1px rgba(255, 240, 228, .08);
  --shadow-card: 0 0 0 1px rgba(255, 240, 228, .07);
  --shadow-pop: 0 0 0 1px rgba(255, 240, 228, .1), 0 16px 36px -8px rgba(0, 0, 0, .6);
}
:root {
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 64px;
  --r-control: 11px; --r-pop: 14px; --r-card: 18px;
  --h-control: 44px;
  --t-display: 44px; --t-h1: 32px; --t-h2: 18px; --t-figure: 26px; --t-body: 15px; --t-label: 13px;
  --m-in: 140ms; --m-out: 200ms; --m-press: 90ms; --m-step: 180ms; --m-slide: 240ms; --m-bar: 400ms; --m-roll: 500ms;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font-code: ui-monospace, "SF Mono", Menlo, monospace;
  --font: "Google Sans Flex", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 var(--t-body)/1.5 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
h1, h2, h3, p, dl, dd, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1 { font-size: var(--t-h1); line-height: 1.06; font-weight: 600; letter-spacing: -.04em; }
h2 { font-size: var(--t-h2); line-height: 1.25; font-weight: 600; letter-spacing: -.025em; }
button, input, select { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--ink-2); }
.label { font-size: var(--t-label); font-weight: 500; color: var(--ink-2); }
.num { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  min-height: var(--h-control); padding: 0 18px; border-radius: var(--r-control);
  border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-card);
  font-weight: 500; letter-spacing: -.01em; white-space: nowrap; cursor: pointer; flex: none;
  transition: transform var(--m-in) var(--ease), background-color var(--m-in) var(--ease), border-color var(--m-in) var(--ease), box-shadow var(--m-in) var(--ease);
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-pop); }
.btn:active { transform: translateY(0) scale(.985); transition-duration: var(--m-press); }
.btn--primary { background: var(--action); color: var(--on-action); box-shadow: none; }
.btn--primary:hover { box-shadow: 0 8px 18px -8px rgba(80, 30, 5, .5); }
.btn--danger { background: var(--danger); color: var(--on-danger); box-shadow: none; }
.btn--quiet { background: transparent; color: var(--ink-2); box-shadow: none; }
.btn--quiet:hover { background: var(--sunk); color: var(--ink); transform: none; box-shadow: none; }
.btn--sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn--icon { width: 36px; min-height: 36px; padding: 0; }
.btn[disabled] { opacity: .6; cursor: default; transform: none; box-shadow: none; }
.btn-row { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; transition: text-decoration-color var(--m-in) var(--ease); }
.link:hover { text-decoration-color: currentColor; }

/* ---------- Fields ---------- */
.field { display: block; margin-bottom: var(--s-4); }
.field__label { display: block; margin-bottom: 6px; font-size: var(--t-label); font-weight: 500; }
.field__hint { margin-top: 6px; font-size: var(--t-label); color: var(--ink-2); }
.field__error { display: flex; gap: 6px; align-items: center; margin-top: 6px; font-size: var(--t-label); color: var(--danger); animation: fade var(--m-in) var(--ease); }
.field__error svg.i { width: 14px; height: 14px; }
.input-wrap { position: relative; }
.input {
  width: 100%; height: 48px; padding: 0 var(--s-3); font-size: 16px;
  background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-control);
  transition: border-color var(--m-in) var(--ease), box-shadow var(--m-in) var(--ease);
}
.input:hover { border-color: var(--ink-2); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.input-wrap .input { padding-right: 48px; }
.input-wrap__btn { position: absolute; right: 6px; top: 6px; width: 36px; height: 36px; display: grid; place-items: center; background: none; border: 0; border-radius: 8px; color: var(--ink-2); cursor: pointer; }
.input-wrap__btn:hover { background: var(--surface-2); color: var(--ink); }
.is-bad .input, .is-bad .picker__btn { border-color: var(--danger); }
.check { display: flex; gap: var(--s-3); align-items: flex-start; cursor: pointer; }
.check input { position: absolute; opacity: 0; width: 20px; height: 20px; margin: 1px 0 0; cursor: pointer; }
.check__box { width: 20px; height: 20px; margin-top: 1px; flex: none; display: grid; place-items: center; border: 1px solid var(--control); border-radius: 6px; background: var(--surface); color: transparent; transition: background-color var(--m-in) var(--ease), border-color var(--m-in) var(--ease); }
.check__box svg.i { width: 14px; height: 14px; stroke-width: 2.5; }
.check input:checked + .check__box { background: var(--action); border-color: var(--action); color: var(--on-action); }
.check input:focus-visible + .check__box { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Picker: replaces every browser dropdown ---------- */
.picker { position: relative; min-width: 0; }
.picker__btn {
  width: 100%; height: var(--h-control); padding: 0 var(--s-3); display: flex; align-items: center; justify-content: space-between; gap: var(--s-2);
  background: var(--surface); border: 1px solid var(--control); border-radius: var(--r-control); cursor: pointer; text-align: left;
  transition: border-color var(--m-in) var(--ease);
}
.picker__btn:hover, .picker__btn[aria-expanded="true"] { border-color: var(--ink); }
.picker__btn .i { color: var(--ink-2); transition: transform var(--m-out) var(--ease); }
.picker__btn[aria-expanded="true"] .i:last-child { transform: rotate(180deg); }
.picker__btn.is-empty { color: var(--ink-2); }
.picker__val { display: flex; align-items: center; gap: var(--s-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker--sm .picker__btn { height: 36px; font-size: 14px; }
.pop {
  position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px); min-width: 180px; max-height: 280px; overflow-y: auto; padding: var(--s-1);
  background: var(--surface); border-radius: var(--r-pop); box-shadow: var(--shadow-pop);
  animation: drop var(--m-out) var(--ease);
}
.pop--up { top: auto; bottom: calc(100% + 6px); }
.pop__opt { width: 100%; min-height: 38px; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); background: none; border: 0; border-radius: 8px; cursor: pointer; text-align: left; }
.pop__opt:hover, .pop__opt:focus-visible { background: var(--surface-2); outline: none; }
.pop__opt .i { color: var(--accent); }

/* ---------- Segmented control ---------- */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; background: var(--sunk); border-radius: var(--r-control); }
.seg__thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / var(--n, 3)); background: var(--surface); border-radius: 8px; box-shadow: var(--shadow-card); transition: transform var(--m-slide) var(--ease); }
.seg[data-i="1"] .seg__thumb { transform: translateX(100%); }
.seg[data-i="2"] .seg__thumb { transform: translateX(200%); }
.seg label { position: relative; text-align: center; cursor: pointer; }
.seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 7px 12px; font-size: 14px; color: var(--ink-2); white-space: nowrap; transition: color var(--m-in) var(--ease); }
.seg input:checked + span { color: var(--ink); font-weight: 500; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }

/* ---------- Surfaces and notes ---------- */
.card { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: var(--s-5); min-width: 0; }
.card--hero { position: relative; overflow: hidden; color: var(--rail-ink); box-shadow: none; background: radial-gradient(90% 80% at 100% 110%, var(--glow-1) 0%, var(--glow-2) 40%, transparent 78%), var(--rail); }
.card--hero .label, .card--hero .muted { color: var(--rail-ink-2); }
.card--hero .delta { color: var(--rail-ink-2); }
.card--hero .delta--up { color: var(--rail-gain); }
.note { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-3) var(--s-4); border-radius: var(--r-control); animation: fade var(--m-in) var(--ease); }
.note > .i { margin-top: 2px; }
.note__body { flex: 1; min-width: 0; }
.note--ok { background: var(--gain-soft); } .note--ok > .i { color: var(--gain); }
.note--warn { background: var(--warn-soft); } .note--warn > .i { color: var(--warn); }
.note--danger { background: var(--danger-soft); } .note--danger > .i { color: var(--danger); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--s-2); border-radius: 6px; background: var(--surface-2); font-size: var(--t-label); color: var(--ink-2); white-space: nowrap; }
.meter { height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
.meter > div { height: 100%; width: 0; border-radius: 2px; background: var(--spent); transition: width var(--m-bar) var(--ease); }
.list > li, .list__row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); padding: var(--s-3) 0; border-top: 1px solid var(--line); }
.list > li:first-child { border-top: 0; }
.glyph { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: var(--r-control); background: var(--surface-2); color: var(--ink-2); }
.figure { font-size: var(--t-figure); font-weight: 600; letter-spacing: -.035em; line-height: 1.15; }
.figure--display { font-size: var(--t-display); letter-spacing: -.045em; line-height: 1.05; }
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-label); font-weight: 500; color: var(--ink-2); }
.delta--up { color: var(--gain); }

/* Command to copy: one line of fixed text with a Copy button. Text stays selectable. */
.cmd { display: flex; align-items: center; gap: var(--s-2); padding: 6px 6px 6px var(--s-4); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-control); }
.cmd code { flex: 1; min-width: 0; font: 500 14px/1.5 var(--font-code); color: var(--ink); overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.cmd .btn { flex: none; }

/* ---------- Dialog ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: var(--s-4); background: rgba(20, 10, 5, .5); animation: fade var(--m-out) var(--ease); }
.dialog { width: 100%; max-width: 420px; padding: var(--s-5); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-pop); animation: rise var(--m-out) var(--ease); }
.dialog p { margin: var(--s-2) 0 var(--s-5); color: var(--ink-2); }
.dialog .btn-row { justify-content: flex-end; }

/* ---------- Task layout: first-time screens, login, locked ---------- */
.task { min-height: 100dvh; display: grid; grid-template-columns: minmax(320px, 400px) 1fr; }
.rail { display: flex; flex-direction: column; padding: var(--s-6); color: var(--rail-ink); background: radial-gradient(130% 42% at 50% 104%, var(--glow-1) 0%, var(--glow-2) 45%, transparent 82%), var(--rail); }
.rail__foot { margin-top: auto; display: flex; gap: var(--s-2); font-size: var(--t-label); color: var(--rail-ink); }
.rail__foot .i { width: 16px; height: 16px; margin-top: 2px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
.brand { letter-spacing: -.02em; }
.brand svg { width: 24px; height: 24px; flex: none; color: var(--ink); --logo-ink: var(--bg); }
.rail .brand svg, .side .brand svg { color: var(--rail-ink); --logo-ink: var(--rail); }
.rail .brand { margin-bottom: var(--s-8); }
.rail-steps { position: relative; }
.rail-step { position: relative; display: grid; grid-template-columns: 24px 1fr; gap: var(--s-3); padding-bottom: var(--s-5); color: var(--rail-ink-2); transition: color var(--m-out) var(--ease); }
.rail-step:not(:last-child)::before { content: ""; position: absolute; left: 11.5px; top: 28px; bottom: 4px; width: 1px; background: var(--rail-line); }
.rail-step__dot { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--rail-line); font-size: 12px; transition: background-color var(--m-out) var(--ease), color var(--m-out) var(--ease), border-color var(--m-out) var(--ease); }
.rail-step__dot .i { width: 14px; height: 14px; stroke-width: 2.5; }
.rail-step__name { font-weight: 500; line-height: 24px; }
.rail-step__detail { font-size: var(--t-label); color: var(--rail-ink-2); }
.rail-step.is-now { color: var(--rail-ink); }
.rail-step.is-now .rail-step__dot { background: var(--spent); border-color: var(--spent); color: var(--rail); font-weight: 600; }
.rail-step.is-done { color: var(--rail-ink); }
.rail-step.is-done .rail-step__dot { background: transparent; border-color: var(--rail-ink-2); color: var(--rail-ink); }
.task__pane { display: flex; flex-direction: column; justify-content: center; padding: var(--s-7) var(--s-7); min-width: 0; overflow-x: clip; }
.task__body { width: 100%; max-width: 520px; margin: 0 auto; }
.task__body--wide { max-width: 640px; }
.task__eyebrow { margin-bottom: var(--s-2); font-size: 14px; font-weight: 600; letter-spacing: -.01em; color: var(--accent); }
.task__lede { margin: var(--s-2) 0 var(--s-6); color: var(--ink-2); font-size: 16px; }
.task__actions { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; margin-top: var(--s-6); }
.task__top { display: none; }
.drop { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s-2); padding: var(--s-7) var(--s-5); border: 1px dashed var(--control); border-radius: var(--r-card); background: var(--surface-2); transition: border-color var(--m-in) var(--ease), background-color var(--m-in) var(--ease); }
.drop.is-over { border-color: var(--accent); background: var(--accent-soft); }
.drop .glyph { width: 48px; height: 48px; margin-bottom: var(--s-2); }
.drop .glyph .i { width: 22px; height: 22px; }

/* ---------- App shell ---------- */
.shell { overflow-x: clip; min-height: 100dvh; display: grid; grid-template-columns: 256px minmax(0, 1fr); transition: grid-template-columns var(--m-slide) var(--ease); }
.shell.is-collapsed { grid-template-columns: 72px minmax(0, 1fr); }
.side { position: sticky; top: 0; z-index: 22; height: 100dvh; display: flex; flex-direction: column; gap: 2px; padding: var(--s-4) var(--s-3); background: var(--rail); color: var(--rail-ink); }
.side .brand { min-height: 40px; padding: 0 6px; margin-bottom: var(--s-4); white-space: nowrap; }
.side__text { white-space: nowrap; transition: opacity var(--m-in) var(--ease); }
.is-collapsed .side__text { opacity: 0; width: 0; overflow: hidden; }
.is-collapsed .side .brand, .is-collapsed .side__link { gap: 0; }
.is-collapsed .side .brand { justify-content: center; padding: 0; }
.is-collapsed .side__link { justify-content: center; padding: 0; }
.side__toggle { margin-top: auto; width: 100%; background: none; border: 0; font: inherit; cursor: pointer; }
.side__toggle .i { transition: transform var(--m-slide) var(--ease); }
.is-collapsed .side__toggle .i { transform: rotate(180deg); }
.is-collapsed .side__link::after { content: attr(data-tip); position: absolute; left: calc(100% + 12px); top: 50%; transform: translateY(-50%); padding: 4px 10px; border-radius: 8px; background: var(--tip); color: var(--on-tip); font-size: var(--t-label); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity var(--m-in) var(--ease); }
.is-collapsed .side__link:hover::after, .is-collapsed .side__link:focus-visible::after { opacity: 1; }
.side__link, .tabbar a { display: flex; align-items: center; gap: var(--s-3); min-height: 40px; padding: 0 var(--s-3); border-radius: var(--r-control); text-decoration: none; font-weight: 500; letter-spacing: -.01em; transition: background-color var(--m-in) var(--ease), color var(--m-in) var(--ease); }
.side__link { position: relative; color: var(--rail-ink-2); }
.tabbar a { color: var(--ink-2); }
.side__link:hover, .side__link[aria-current] { background: rgba(255, 240, 228, .1); color: var(--rail-ink); }
.side__link[aria-current] .i { color: var(--spent); }
.side :focus-visible { outline-color: var(--rail-ink); }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--s-2); min-height: 64px; padding: var(--s-2) var(--s-6); background: var(--bg); border-bottom: 1px solid var(--line); }
.top h1 { font-size: 22px; letter-spacing: -.03em; margin-right: auto; }
.top > .picker { width: 164px; }
.page { padding: var(--s-5) var(--s-6) var(--s-7); max-width: 1160px; margin: 0 auto; overflow-x: clip; }
.tabbar { display: none; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--s-4); }
.span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }

<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.500 8.500V6.500a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.500 7h15M10 7V5h4v2M6.500 7l1 12a2 2 0 0 0 2 1.800h5a2 2 0 0 0 2-1.800l1-12M10.500 11v6M13.500 11v6"/></symbol>

</defs></svg>
<div id="app"></div>
<div class="pv" id="pv"></div>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)], app=$('#app');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ic=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const LOGO=`<svg viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="7" fill="currentColor"/><path d="M7 16.500v-3M12 16.500v-6M17 16.500v-9" stroke="var(--logo-ink,#0C3A32)" stroke-width="2.400" stroke-linecap="round"/></svg>`;
const MODE='settings';
/* ===== Setup lists, shared by screens 5 and 13. Preview code, not app code. =====
   Made-up names, at the volume a real file has: 60 accounts, 31 income and 35 expense categories.
   Income and Expenses are the same list: the owner's own groups, each category in one, subcategories follow. */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const AG=['Bank','Cards','Wallets','Investments','Money with others','Business'];
const GI={Bank:'bank',Cards:'card',Wallets:'wallet',Investments:'trend','Money with others':'people',Business:'case',Ungrouped:'q','':'q'};
const ACC_BY={
 Ungrouped:['Work Expenses','Old Wallet','Misc Account'],
 Bank:['Everyday Bank','Rainy Day Bank','Salary Account','Joint Savings','Home Savings','Fixed Deposit 2024','Fixed Deposit 2025','Recurring Deposit'],
 Cards:['Blue Rewards Card','Travel Miles Card','Fuel Card','Shopping Card','Office Card','Backup Card'],
 Wallets:['Pocket Wallet','Cash at Home','Phone Wallet','Travel Cash','Metro Card','Gift Card Balance','Food Wallet'],
 Investments:['Index Fund','Large Cap Fund','Mid Cap Fund','Small Cap Fund','Flexi Cap Fund','Debt Fund','Liquid Fund','Gold Fund','International Fund','Tax Saver Fund','Hybrid Fund','Shares Account','Retirement Fund','Provident Fund','Public Savings Scheme','Gold Coins','Bonds 2028','Bonds 2031','Pension Plan','Child Plan','Equity Basket','Silver Fund'],
 'Money with others':['Lent to Friend','Lent to Cousin','Deposit with Landlord','Owed by Flatmate','Security Deposit','Advance to Builder','Loan to Brother','Shared Trip Pot','Chit Group'],
 Business:['Studio Account','Studio Card','Client Advances','Equipment Fund','Tax Reserve']};
const ACC=[];Object.entries(ACC_BY).forEach(([g,l])=>l.forEach(n=>ACC.push({name:n,group:g})));
const mk=([name,s,g])=>({name,subs:s?s.split(','):[],g});
/* Third field: the group each category is in on screen 13's made-up saved answers. */
const CATS={
 inc:[['Salary','Base pay,Bonus,Overtime,Allowances,Employee share plan','w'],['Freelance','Design work,Writing,Consulting','w'],['Business income','Studio sales,Workshops','w'],['Interest','Savings interest,Deposit interest,Bond interest','s'],['Dividends','Shares,Funds','s'],['Capital gains','Equity,Debt,Gold','s'],['Rent received','Flat,Parking','s'],['Loans received','Home loan,Car loan,Personal loan',''],['Refunds','Shopping,Travel,Tax',''],['Cashback','Cards,Wallets',''],['Gifts received','Family,Festivals,Wedding','f'],['Prize money','',''],['Pension','',''],['Tutoring','Online,At home','w'],['Royalties','Books,Music','w'],['Insurance claims','Health,Vehicle',''],['Selling items','Furniture,Phones,Books',''],['Pocket money','','f'],['Tax refund','',''],['Side project','App sales,Ads,Sponsorships','w'],['Stipend','Fellowship,Research','w'],['Commission','Referrals,Sales','w'],['Maturity proceeds','Deposits,Insurance plans','s'],['Chit returns','','s'],['Reward points','',''],['Agriculture','Crops,Dairy','w'],['Retainers','Client one,Client two','w'],['Partnership share','','s'],['Family support','Parents,Sibling','f'],['Other income','Miscellaneous',''],['No category','','']].map(mk),
 exp:[['Groceries','Vegetables,Staples,Dairy,Snacks','n'],['Eating out','Restaurants,Cafes,Delivery','w'],['Rent','Flat,Parking','n'],['Utilities','Electricity,Water,Gas,Internet,Phone','n'],['Transport','Fuel,Cabs,Metro,Servicing','n'],['Shopping','Clothes,Shoes,Gadgets,Home items','w'],['Health','Doctor,Medicines,Tests','n'],['Fitness','Gym,Classes,Gear','w'],['Education','Courses,Books,Fees','f'],['Entertainment','Movies,Streaming,Events','w'],['Travel','Flights,Trains,Hotels,Local travel','w'],['Gifts given','Family,Friends,Festivals','f'],['Household help','Cook,Cleaning','n'],['Home repairs','Plumbing,Electrical,Painting','n'],['Furniture','','b'],['Personal care','Salon,Toiletries','w'],['Kids','School,Toys,Clothes','f'],['Pets','Food,Vet','f'],['Insurance','Life,Vehicle,Home','n'],['Taxes','Income tax,Property tax','n'],['Loan payments','Home loan,Car loan','n'],['Charity','Donations,Temple',''],['Subscriptions','Software,News,Music','w'],['Bank charges','',''],['Parents','Medical,Monthly support','f'],['Hobbies','Music,Photography,Gardening','w'],['Festivals','Diwali,Holi,Weddings','f'],['Office','Lunch,Commute','n'],['Laundry','','n'],['Car care','Wash,Accessories',''],['Weekend trips','Stays,Food','w'],['Stationery','',''],['Mobile recharge','','n'],['Fines and fees','',''],['Miscellaneous','Other','']].map(mk)};
const SAVED_GROUPS={inc:[{id:'w',name:'Work'},{id:'s',name:'From savings'},{id:'f',name:'Family and gifts'}],exp:[{id:'n',name:'Needs'},{id:'w',name:'Wants'},{id:'f',name:'Family'},{id:'b',name:'Big plans'}]};
const GK=['inc','exp'];

/* Answers being edited (A), what the owner sees open and searched (U), and where each row sits (HOME).
   A row stays where it is after its picker changes, with a "Moved to" tag, so nothing jumps away
   under the pointer. Rows settle into their new group when a group opens or closes, the search
   changes, or the page loads again. */
let A=null,HOME={acc:[],inc:[],exp:[]},gseq=100,onChange=()=>{};
const U={open:{acc:new Set(),inc:new Set(),exp:new Set()},sopen:{acc:new Set(),inc:new Set(),exp:new Set()},q:{acc:'',inc:'',exp:''},edit:null,off:false};
const home=()=>{HOME={acc:A.acc.slice(),inc:A.c.inc.slice(),exp:A.c.exp.slice()}};
const plural=(n,one,many)=>n===0?'No '+many:n===1?'1 '+one:n+' '+many;
const accKeys=()=>MODE==='first'?['',...AG]:['Ungrouped',...AG];
const accOpts=()=>MODE==='first'?AG:['Ungrouped',...AG];
const gName=(k,id)=>id?(A.g[k].find(g=>g.id===id)||{name:''}).name:'Not grouped';
const gId=(k,name)=>name==='Not grouped'?'':(A.g[k].find(g=>g.name===name)||{id:''}).id;
const accSum=g=>plural(A.acc.filter(x=>x===g).length,'account','accounts');
const catSum=(k,id)=>plural(A.c[k].filter(x=>x===id).length,'category','categories');

/* Picker, also used as the row menu. Arrow keys move, Enter picks, Esc closes. */
const PK={};let open=null;
function picker(id,value,opts,onPick,{label='',placeholder='Choose',sm}={}){PK[id]={value,opts,onPick};
 return `<div class="picker ${sm?'picker--sm':''}" data-picker="${id}"><button type="button" class="picker__btn ${value?'':'is-empty'}" aria-haspopup="listbox" aria-expanded="false" aria-label="${esc(label)}" ${U.off?'disabled':''}><span class="picker__val">${esc(value||placeholder)}</span>${ic('chev')}</button></div>`}
function closePop(focus){if(!open)return;const{el}=open;$(':scope > .pop',el)?.remove();const b=$(':scope > button',el);b.setAttribute('aria-expanded','false');if(focus)b.focus();open=null}
function showPop(el,pop,type,items){el.append(pop);const r=el.getBoundingClientRect(),need=Math.min(290,pop.scrollHeight+8);if(innerHeight-r.bottom<need&&r.top>innerHeight-r.bottom)pop.classList.add('pop--up');$(':scope > button',el).setAttribute('aria-expanded','true');open={el,type,items};($('[aria-selected=true]',pop)||$('.pop__opt',pop)).focus()}
function opt(text,sel,role){const b=document.createElement('button');b.type='button';b.className='pop__opt';b.setAttribute('role',role);if(role==='option')b.setAttribute('aria-selected',String(sel));const s=document.createElement('span');s.textContent=text;b.append(s);if(sel)b.insertAdjacentHTML('beforeend',ic('check'));return b}
function openPicker(el){const p=PK[el.dataset.picker],opts=typeof p.opts==='function'?p.opts():p.opts;const pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','listbox');
 opts.forEach(o=>{const b=opt(o,o===p.value,'option');b.dataset.v=o;pop.append(b)});showPop(el,pop,'picker')}
function openMenu(el,items){const pop=document.createElement('div');pop.className='pop';pop.setAttribute('role','menu');items.forEach((it,i)=>{const b=opt(it[0],false,'menuitem');b.dataset.i=i;pop.append(b)});showPop(el,pop,'menu',items)}

/* Pieces */
const searchBox=(k,ph)=>`<div class="search">${ic('search')}<label class="sr" for="q-${k}">${ph}</label><input class="input" type="search" id="q-${k}" data-q="${k}" placeholder="${ph}" autocomplete="off" spellcheck="false" value="${esc(U.q[k])}"><button class="input-wrap__btn" type="button" data-clear="${k}" aria-label="Clear search" ${U.q[k]?'':'hidden'}>${ic('x')}</button></div><p class="search__count" id="cnt-${k}" aria-live="polite"></p>`;
const noneBox=k=>`<div class="search__none" id="none-${k}" hidden></div>`;
function fold(k,key,i,o){const op=U.open[k].has(key);
 const head=o.edit?inlineEdit():`<div class="fold__head"><button class="fold__btn" type="button" id="fh-${k}-${i}" aria-expanded="${op}" aria-controls="fb-${k}-${i}">${o.glyph?`<span class="glyph">${ic(o.glyph)}</span>`:''}<span class="fold__text"><span class="fold__name">${esc(o.name)}</span><span class="fold__sum" data-sum>${esc(o.sum)}</span></span>${ic('chev','fold__chev')}</button>${o.menu||''}</div>`;
 return `<div class="fold ${o.glyph?'fold--glyph':''}" data-fold="${k}" data-key="${esc(key)}" data-s="${esc(o.s||'')}">${head}<div class="fold__body" id="fb-${k}-${i}" ${op?'':'hidden'}><div class="pick-rows" ${o.rows?'':'hidden'}>${o.rows}</div><p class="fold__empty" ${o.rows?'hidden':''}>Nothing in this group yet.</p></div></div>`}
const movedTag=(show,to)=>`<span class="tag" data-moved ${show?'':'hidden'}>${show?'Moved to '+esc(to):''}</span>`;

/* Accounts */
function accRow(a,j){const v=A.acc[j],h=HOME.acc[j],sug=MODE==='first'&&a.sug&&v===a.group;
 return `<div class="pick-row pick-row--plain" data-row="acc" data-j="${j}" data-s="${esc(a.name.toLowerCase())}"><div class="pick-row__name"><span>${esc(a.name)}</span>${sug?'<span class="tag" data-sug>Suggested</span>':''}${movedTag(h!==''&&v!==h,v)}</div>${picker('acc'+j,v,accOpts,x=>pickAcc(j,x),{label:'Group for '+a.name,placeholder:'Choose a group'})}</div>`}
const accList=()=>`${searchBox('acc','Find an account')}<div class="folds" id="folds-acc">${accKeys().map((g,i)=>fold('acc',g,i,{glyph:GI[g],name:g===''?'Needs a group':g,s:g.toLowerCase(),sum:accSum(g),rows:ACC.map((a,j)=>HOME.acc[j]===g?accRow(a,j):'').join('')})).join('')}</div>${noneBox('acc')}`;
function pickAcc(j,v){A.acc[j]=v;const r=$(`[data-row=acc][data-j="${j}"]`),f=r.closest('.fold').dataset.key;if(v!==ACC[j].group)$('[data-sug]',r)?.remove();
 const t=$('[data-moved]',r),mv=f!==''&&v!==f;t.hidden=!mv;t.textContent=mv?'Moved to '+v:'';r.classList.remove('is-bad');$('.field__error',r)?.remove();sums('acc');onChange('acc')}

/* Income and expenses: one builder for both */
function catRow(k,c,j){const v=A.c[k][j],h=HOME[k][j];
 return `<div class="pick-row pick-row--plain" data-row="${k}" data-j="${j}" data-s="${esc((c.name+' '+c.subs.join(' ')).toLowerCase())}"><div><div class="pick-row__name"><span>${esc(c.name)}</span>${movedTag(v!==h,gName(k,v))}</div>${c.subs.length?`<div class="pick-row__sub">${esc(c.subs.join(' · '))}</div>`:''}</div>${A.g[k].length?picker(k+j,gName(k,v),()=>['Not grouped',...A.g[k].map(g=>g.name)],x=>pickCat(k,j,x),{label:'Group for '+c.name}):''}</div>`}
const menuBtn=(k,g)=>`<div class="menu"><button class="btn btn--sm btn--icon btn--quiet" type="button" data-menu="${esc(g.id)}" data-k="${k}" aria-haspopup="menu" aria-expanded="false" aria-label="Options for ${esc(g.name)}" ${U.off?'disabled':''}>${ic('more')}</button></div>`;
function inlineEdit(){const m=U.edit,add=m.mode==='add';
 return `<div class="inline-edit ${m.err?'is-bad':''}"><label class="field__label" for="ge">${add?'New group name':'Group name'}</label><div class="inline-edit__row"><input class="input" id="ge" value="${esc(m.value)}" autocomplete="off" spellcheck="false" aria-describedby="ge-msg" ${m.err?'aria-invalid="true"':''}><button class="btn" type="button" data-edit-ok>${add?'Add group':'Rename'}</button><button class="btn btn--quiet" type="button" data-edit-cancel>Cancel</button></div>${editMsg()}</div>`}
const editMsg=()=>U.edit.err?`<p class="field__error" id="ge-msg">${ic('alert')}<span>${esc(U.edit.err)}</span></p>`:`<p class="field__hint" id="ge-msg">Up to 40 characters.</p>`;
function addRow(k){if(U.edit&&U.edit.k===k&&U.edit.mode==='add')return inlineEdit();const n=A.g[k].length;
 return `<div class="add-row">${n>=12?`<p class="field__hint" id="limit-${k}">You have 12 groups, the most you can have. Remove one to add another.</p>`:`<button class="btn btn--sm" type="button" id="add-${k}" data-add="${k}" ${U.off?'disabled':''}>${ic('plus')}Add a group</button><p class="field__hint">${n?n+' of 12 groups.':'Up to 12 groups, such as '+(k==='inc'?'Work and Savings':'Needs and Wants')+'.'}</p>`}</div>`}
const catList=k=>`${searchBox(k,'Find a category')}<div class="folds" id="folds-${k}">${[{id:'',name:'Not grouped'},...A.g[k]].map((g,i)=>fold(k,g.id,i,{name:g.name,s:g.id?g.name.toLowerCase():'',sum:catSum(k,g.id),menu:g.id?menuBtn(k,g):'',edit:U.edit&&U.edit.k===k&&U.edit.mode==='rename'&&U.edit.id===g.id,rows:CATS[k].map((c,j)=>HOME[k][j]===g.id?catRow(k,c,j):'').join('')})).join('')}</div>${noneBox(k)}${addRow(k)}`;
function pickCat(k,j,name){const id=gId(k,name);A.c[k][j]=id;const r=$(`[data-row=${k}][data-j="${j}"]`),f=r.closest('.fold').dataset.key,t=$('[data-moved]',r),mv=id!==f;t.hidden=!mv;t.textContent=mv?'Moved to '+name:'';sums(k);onChange(k)}
function checkName(k,v,self){const t=v.trim(),low=t.toLowerCase();if(!t)return'Give the group a name.';if([...t].length>40)return'Use 40 characters or fewer.';
 if(low==='not grouped')return'“Not grouped” is kept for categories without a group.';const d=A.g[k].find(g=>g.id!==self&&g.name.toLowerCase()===low);if(d)return`You already have a group called “${d.name}”.`;return''}
const foldHead=(k,key)=>$(`.fold[data-fold=${k}][data-key="${key}"] .fold__btn`);
function startAdd(k){if(U.edit)cancelEdit(true);U.edit={k,mode:'add',value:'',err:''};redraw(k);$('#ge').focus()}
function startRename(k,id){if(U.edit)cancelEdit(true);U.edit={k,mode:'rename',id,value:gName(k,id),err:''};redraw(k);$('#ge').select()}
function cancelEdit(quiet){const m=U.edit;U.edit=null;redraw(m.k);if(!quiet)(m.mode==='add'?$('#add-'+m.k):foldHead(m.k,m.id))?.focus()}
function submitEdit(){const m=U.edit,k=m.k,v=$('#ge').value;m.value=v;m.tried=true;m.err=checkName(k,v,m.id);if(m.err){editErr();$('#ge').focus();return}
 const t=v.trim();let id=m.id;if(m.mode==='add'){id='g'+(++gseq);A.g[k].push({id,name:t});if(A.g[k].length===1)U.open[k].add('')}else A.g[k].find(g=>g.id===id).name=t;
 U.edit=null;redraw(k);foldHead(k,id)?.focus();onChange(k)}
function editErr(){const w=$('.inline-edit'),i=$('#ge');w.classList.toggle('is-bad',!!U.edit.err);i.toggleAttribute('aria-invalid',!!U.edit.err);$('#ge-msg').outerHTML=editMsg()}
function askRemove(k,id){const g=A.g[k].find(x=>x.id===id),n=A.c[k].filter(x=>x===id).length;
 const go=()=>{A.c[k]=A.c[k].map(x=>x===id?'':x);HOME[k]=HOME[k].map(x=>x===id?'':x);A.g[k]=A.g[k].filter(x=>x.id!==id);U.open[k].delete(id);redraw(k);foldHead(k,'')?.focus();onChange(k)};
 if(!n){go();return}
 dialog(`Remove “${esc(g.name)}”?`,`${n===1?'Its 1 category goes':'Its '+n+' categories go'} back to Not grouped.${MODE==='first'?'':' Nothing changes until you save.'}`,'Keep group','Remove group',go,foldHead(k,id),true)}

/* Open, close, search and settle */
function setOpen(f,o){const b=$('.fold__btn',f),body=$('.fold__body',f);b&&b.setAttribute('aria-expanded',String(o));if(body.hidden===o)body.hidden=!o}
function sums(k){$$(`.fold[data-fold=${k}]`).forEach(f=>{const s=$('[data-sum]',f);if(s)s.textContent=k==='acc'?accSum(f.dataset.key):catSum(k,f.dataset.key)})}
function settle(k){const box=$('#folds-'+k);if(!box)return;const val=j=>k==='acc'?A.acc[j]:A.c[k][j],to={};
 $$('.fold',box).forEach(f=>to[f.dataset.key]=$('.pick-rows',f));
 $$('[data-row]',box).sort((a,b)=>a.dataset.j-b.dataset.j).forEach(r=>{const t=to[val(+r.dataset.j)];t&&t.append(r)});
 $$('[data-moved]',box).forEach(t=>t.hidden=true);
 $$('.fold',box).forEach(f=>{const pr=$('.pick-rows',f),has=pr.children.length>0;pr.hidden=!has;$('.fold__empty',f).hidden=has});
 HOME[k]=(k==='acc'?A.acc:A.c[k]).slice()}
function filter(k,reopen){const box=$('#folds-'+k);if(!box)return;const raw=U.q[k].trim(),q=raw.toLowerCase();let n=0,shown=0;if(reopen)U.sopen[k]=new Set();
 [...box.children].forEach(f=>{const hit=!!q&&!!f.dataset.s&&f.dataset.s.includes(q);let any=0;
  $$('[data-row]',f).forEach(r=>{const m=!q||hit||r.dataset.s.includes(q);r.hidden=!m;if(m)any++});
  f.hidden=!!q&&!any&&!hit;if(!f.hidden){shown++;n+=any}if(q&&reopen&&!f.hidden)U.sopen[k].add(f.dataset.key);
  setOpen(f,q?U.sopen[k].has(f.dataset.key):U.open[k].has(f.dataset.key))});
 box.hidden=!!q&&!shown;const cnt=$('#cnt-'+k),none=$('#none-'+k);
 if(!q){cnt.textContent='';none.hidden=true;return}
 cnt.textContent=shown?(n===1?'1 match':n+' matches'):'';none.hidden=!!shown;
 if(!shown)none.innerHTML=`<span>Nothing matches “${esc(raw)}”.</span><button class="link" type="button" data-clear="${k}">Clear search</button>`}
function redraw(k){const w=$('#list-'+k);if(!w)return;w.innerHTML=k==='acc'?accList():catList(k);if(U.q[k].trim())filter(k,true)}
function kitAfter(){['acc','inc','exp'].forEach(k=>{if(U.q[k].trim())filter(k,true)})}
function clearSearch(k){U.q[k]='';const i=$('#q-'+k);i.value='';$(`.search [data-clear=${k}]`).hidden=true;settle(k);filter(k,true);i.focus()}

/* Dialog: traps focus, starts on the safe button */
function dialog(title,text,keep,go,onGo,back,danger){const s=document.createElement('div');s.className='scrim';
 s.innerHTML=`<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dt" aria-describedby="dd"><h2 id="dt">${title}</h2><p id="dd">${text}</p><div class="btn-row"><button class="btn" id="dk" data-esc>${keep}</button><button class="btn ${danger?'btn--danger':'btn--primary'}" id="dg">${go}</button></div></div>`;
 document.body.append(s);$('#dk').focus();$('#dk').onclick=()=>{s.remove();back&&back.isConnected&&back.focus()};$('#dg').onclick=()=>{s.remove();onGo()};
 s.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();($('#dk')===document.activeElement?$('#dg'):$('#dk')).focus()}})}

/* Events, shared */
document.addEventListener('click',e=>{const o=e.target.closest('.pop__opt');
 if(o&&open&&open.el.contains(o)){const m=open;if(m.type==='picker'){const p=PK[m.el.dataset.picker];p.value=o.dataset.v;const b=$(':scope > button',m.el);$('.picker__val',b).textContent=p.value;b.classList.remove('is-empty');closePop(true);p.onPick(p.value)}else{const fn=m.items[+o.dataset.i][1];closePop(false);fn()}return}
 const pb=e.target.closest('.picker__btn');if(pb){const el=pb.parentElement,same=open&&open.el===el;closePop();if(!same)openPicker(el);return}
 const mb=e.target.closest('[data-menu]');if(mb){const el=mb.parentElement,same=open&&open.el===el,id=mb.dataset.menu,k=mb.dataset.k;closePop();if(!same)openMenu(el,[['Rename',()=>startRename(k,id)],['Remove',()=>askRemove(k,id)]]);return}
 if(open&&!e.target.closest('.pop'))closePop();
 if(!e.target.closest('.pv'))$('.pv__menu')?.remove();
 const fb=e.target.closest('.fold__btn');if(fb){const f=fb.closest('.fold'),k=f.dataset.fold,key=f.dataset.key,op=fb.getAttribute('aria-expanded')!=='true';settle(k);filter(k,false);const set=U.q[k].trim()?U.sopen[k]:U.open[k];op?set.add(key):set.delete(key);setOpen(f,op);return}
 const cl=e.target.closest('[data-clear]');if(cl){clearSearch(cl.dataset.clear);return}
 const ad=e.target.closest('[data-add]');if(ad){startAdd(ad.dataset.add);return}
 if(e.target.closest('[data-edit-ok]')){submitEdit();return}
 if(e.target.closest('[data-edit-cancel]')){cancelEdit();return}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.q){const k=t.dataset.q;U.q[k]=t.value;$(`.search [data-clear=${k}]`).hidden=!t.value;settle(k);filter(k,true)}
 if(t.id==='ge'&&U.edit){U.edit.value=t.value;if(U.edit.tried){U.edit.err=checkName(U.edit.k,t.value,U.edit.id);editErr()}}});
document.addEventListener('keydown',e=>{const t=e.target;
 if(t.id==='ge'){if(e.key==='Enter'){e.preventDefault();submitEdit()}else if(e.key==='Escape'){e.preventDefault();cancelEdit()}return}
 if(t.dataset&&t.dataset.q&&e.key==='Escape'&&t.value){e.preventDefault();clearSearch(t.dataset.q);return}
 if(e.key==='Escape'){if(open)closePop(true);else $('.scrim [data-esc]')?.click()}
 if(open&&e.key==='Tab')closePop();
 if(open&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const o=$$('.pop__opt',open.el),i=o.indexOf(document.activeElement);o[(i+(e.key==='ArrowDown'?1:-1)+o.length)%o.length].focus()}});

/* ===== Screen 13: Settings ===== */
const TABS=['Setup','Your data','AI'];
const fresh=()=>({acc:ACC.map(a=>a.group),g:JSON.parse(JSON.stringify(SAVED_GROUPS)),c:{inc:CATS.inc.map(c=>c.g),exp:CATS.exp.map(c=>c.g)}});
const clone=o=>JSON.parse(JSON.stringify(o));
let saved=fresh();A=fresh();
const S={tab:0,state:'',noCats:false,undo:true,note:''};
const dirty=()=>JSON.stringify(A)!==JSON.stringify(saved);
const openDefault=()=>{U.open={acc:new Set(['Ungrouped']),inc:new Set(['']),exp:new Set([''])};U.q={acc:'',inc:'',exp:''};U.edit=null};
openDefault();

function savebar(){const d=dirty(),st=S.state,off=U.off&&st!=='saving';let cls=d?'is-dirty':'',txt=d?'You have unsaved changes.':'No unsaved changes.';
 if(st==='saved'&&!d){cls='is-ok';txt=`${ic('check')}<span>Saved. Every screen now uses these answers.</span>`}
 if(st==='failed'){cls='is-bad';txt=`${ic('alert')}<span>Setup couldn't be saved. Nothing was changed.</span>`}
 return `<div class="savebar ${cls}" id="savebar"><p class="savebar__text" id="sbt" role="status" tabindex="-1">${txt}</p><button class="btn btn--primary" type="button" id="save" ${(d||st==='failed')&&!off&&st!=='saving'?'':'disabled'}>${st==='saving'?'Saving…':st==='failed'?'Try again':'Save changes'}</button><button class="btn" type="button" id="discard" ${d&&st!=='saving'?'':'hidden'}>Discard</button></div>`}
function setup(){
 const top=S.state==='stale'?`<div class="note note--warn mb-5" role="status">${ic('alert')}<div class="note__body">Your data changed in another window.</div><button class="link" type="button" id="reload">Reload</button></div>`:'';
 return `${top}
 <section class="card mb-5" aria-labelledby="h-acc"><h2 id="h-acc">Accounts</h2><p class="muted card__intro">The group decides where each account shows and what counts towards net worth.</p><div id="list-acc">${accList()}</div></section>
 ${S.noCats?'':`<section class="card mb-5" aria-labelledby="h-inc" id="card-inc"><h2 id="h-inc">Income</h2><p class="muted card__intro">Make your own groups, such as Work and Savings, and put each category in one. Subcategories go with their category.</p><div id="list-inc">${catList('inc')}</div></section>`}
 <section class="card" aria-labelledby="h-exp" id="card-exp"><h2 id="h-exp">Expenses</h2><p class="muted card__intro">Make your own groups, such as Needs and Wants, and put each category in one. Subcategories go with their category.</p><div id="list-exp">${catList('exp')}</div></section>
 ${savebar()}`}
function yourData(){
 const top=S.note==='undone'?`<div class="note note--ok mb-5" role="status">${ic('check')}<div class="note__body">Your data is back to how it was.</div><button class="link" type="button" id="dismiss">Dismiss</button></div>`
  :S.note==='undofail'?`<div class="note note--danger mb-5" role="alert">${ic('alert')}<div class="note__body">The undo couldn't be finished. Nothing was changed.</div><button class="btn btn--sm" type="button" id="undo2">Try again</button></div>`:'';
 return `${top}<section class="card" aria-labelledby="h-data"><h2 id="h-data">Your data</h2>
 <ul class="list mt-4">
  <li><span class="with-glyph"><span class="glyph">${ic('file')}</span><span><span class="pick-row__name">Last upload</span><span class="pick-row__sub">${S.undo?'2 Nov 2026 · 4,812 rows':'5 Oct 2026 · 4,655 rows'}</span></span></span></li>
  <li><span class="with-glyph"><span class="glyph">${ic('spark')}</span><span><span class="pick-row__name">Undo last update</span><span class="pick-row__sub">${S.undo?'Goes back to your data from before 2 Nov 2026.':'Nothing to undo yet.'}</span></span></span>${S.undo?'<button class="btn btn--sm" type="button" id="undo">Undo</button>':''}</li>
  <li><span class="with-glyph"><span class="glyph">${ic('trash')}</span><span class="pick-row__name">Delete my data</span></span><a class="btn btn--sm" href="#" id="del">Open</a></li>
 </ul></section>`}
const ai=()=>`<section class="card" aria-labelledby="h-ai"><h2 id="h-ai">AI</h2><p class="muted mt-4">AI settings arrive in a later phase.</p></section>`;
const nav=[['Overview','home'],['Spending','bars'],['Savings & Net worth','trend'],['Accounts & Investments','bank']],short=['Overview','Spending','Savings','Accounts'];
function view(){return `<div class="shell"><nav class="side" aria-label="Screens"><div class="brand">${LOGO}<span class="side__text">Personal Finance</span></div>${nav.map(n=>`<a class="side__link" href="#" data-leave data-tip="${n[0].replace('&','&amp;')}">${ic(n[1])}<span class="side__text">${n[0].replace('&','&amp;')}</span></a>`).join('')}<button class="side__link side__toggle" id="fold" type="button" data-tip="Expand sidebar" aria-expanded="true" aria-label="Collapse sidebar">${ic('fold')}<span class="side__text">Collapse</span></button></nav>
 <div><header class="top"><h1>Settings</h1><div class="picker picker--sm"><button type="button" class="picker__btn" aria-label="Period" disabled><span class="picker__val">This month</span>${ic('chev')}</button></div>
  <button class="btn btn--sm only-wide" type="button" data-leave>${ic('upload')}Upload</button><button class="btn btn--sm btn--quiet only-wide" type="button" aria-current="page">${ic('gear')}Settings</button><button class="btn btn--sm btn--quiet only-wide" type="button">${ic('out')}Log out</button>
  <button class="btn btn--sm btn--icon only-narrow" type="button" aria-label="Upload" data-leave>${ic('upload')}</button><button class="btn btn--sm btn--icon only-narrow" type="button" aria-label="Settings and log out">${ic('more')}</button></header>
 <main class="page"><div class="task__body task__body--wide">
  <div class="seg mb-5" role="radiogroup" aria-label="Settings section" data-i="${S.tab}"><span class="seg__thumb"></span>${TABS.map((t,j)=>`<label><input type="radio" name="tab" data-tab="${j}" ${S.tab===j?'checked':''}><span>${t}</span></label>`).join('')}</div>
  <div id="sec">${[setup,yourData,ai][S.tab]()}</div></div></main></div>
 <nav class="tabbar" aria-label="Screens">${nav.map((n,i)=>`<a href="#" data-leave>${ic(n[1])}${short[i]}</a>`).join('')}</nav></div>`}

/* ---------- Behaviour ---------- */
function render(){open=null;home();app.innerHTML=view();wire();kitAfter()}
/* A change turns Save on and shows Discard. A saved or failed line goes, because it's no longer true. */
onChange=()=>{if(S.state==='saved'||S.state==='failed')S.state='';drawBar()};
function drawBar(){const b=$('#savebar');if(!b)return;b.outerHTML=savebar();wireBar()}
function wireBar(){$('#save')&&($('#save').onclick=()=>save(S.fail));$('#discard')&&($('#discard').onclick=()=>{A=clone(saved);S.state='';U.edit=null;render();$('#sbt').focus()})}
function leave(then,back){if(S.tab===0&&dirty())dialog('Leave without saving?','Your changes will be lost.','Keep editing','Leave',()=>{A=clone(saved);then()},back);else then()}
function save(fail){S.state='saving';U.off=true;render();setTimeout(()=>{U.off=false;S.fail=false;if(fail)S.state='failed';else{saved=clone(A);S.state='saved'}render();$('#sbt').focus()},reduce?250:800)}
function undo(fail){dialog('Undo this update?',"Your data and setup answers go back to how they were before this update on 2 Nov 2026. To use this file again, you'd upload it again.",'Keep this update','Undo update',()=>{if(fail)S.note='undofail';else{S.note='undone';S.undo=false}render()},$('#undo'))}
function wire(){
 $$('[data-tab]').forEach(r=>r.onchange=()=>{const j=+r.dataset.tab,was=S.tab;const go=()=>{S.tab=j;S.state='';S.note='';render();$(`[data-tab="${j}"]`).focus()};
  if(was===0&&dirty()){r.checked=false;$(`[data-tab="${was}"]`).checked=true;leave(go,$(`[data-tab="${was}"]`))}else go()});
 $$('[data-leave]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();leave(()=>render(),b)}));
 wireBar();
 $('#reload')&&($('#reload').onclick=()=>{A=clone(saved);S.state='';U.off=false;render()});
 $('#undo')&&($('#undo').onclick=()=>undo(false));
 $('#undo2')&&($('#undo2').onclick=()=>{S.note='undone';S.undo=false;render()});
 $('#dismiss')&&($('#dismiss').onclick=()=>{S.note='';render()});
 $('#del')&&($('#del').onclick=e=>e.preventDefault());
 const fold=$('#fold'),shell=$('.shell');const setFold=c=>{shell.classList.toggle('is-collapsed',c);fold.setAttribute('aria-expanded',String(!c));fold.setAttribute('aria-label',c?'Expand sidebar':'Collapse sidebar');try{localStorage.setItem('side',c?'1':'0')}catch{}};let was=false;try{was=localStorage.getItem('side')==='1'}catch{}setFold(was);fold.onclick=()=>setFold(!shell.classList.contains('is-collapsed'))}

/* ---------- Preview control ---------- */
const pv=$('#pv');pv.innerHTML='<button class="pv__btn" type="button" aria-expanded="false">Preview</button>';
const toggleTheme=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'};
const change=()=>{const a=fresh();a.acc[0]='Money with others';a.c.inc[7]='s';a.c.exp[21]='f';return a};
const twelve=()=>{const a=fresh();['Home','Health','Kids','Fun','Car','Gifts','Learning','Giving'].forEach((n,i)=>a.g.exp.push({id:'x'+i,name:n}));return a};
const MENU=[
 ['Setup',[['Normal',{}],['After a change',{a:change}],['Saving',{a:change,state:'saving'}],['Saved',{state:'saved'}],["Couldn't save",{a:change,state:'failed'}],['Changed in another window',{a:change,state:'stale'}],['No income categories',{noCats:true}],['Leaving with changes',{a:change,ask:true}]]],
 ['Finding',[['Search with matches',{q:'acc:fund'}],['Search with no match',{q:'acc:yacht',to:'h-acc'}],['Income search',{q:'inc:loan',to:'h-inc'}]]],
 ['Income and expense groups',[['Adding an income group',{edit:{k:'inc',mode:'add',value:'',err:''}}],['Removing an income group',{rm:'inc:s'}],['Adding an expense group',{edit:{k:'exp',mode:'add',value:'',err:''}}],['Duplicate group name',{edit:{k:'exp',mode:'add',value:'Wants',err:'You already have a group called “Wants”.',tried:true}}],['Name too long',{edit:{k:'exp',mode:'add',value:'Things we only buy once every few years or so',err:'',tried:true},long:true}],['Renaming a group',{edit:{k:'exp',mode:'rename',id:'b',value:'Big plans',err:''}}],['Group limit reached',{a:twelve}],['Removing an expense group',{rm:'exp:w'}]]],
 ['Your data',[['With an update to undo',{tab:1}],['Undo dialog',{tab:1,dlg:true}],['After undo',{tab:1,undo:false,note:'undone'}],["Undo couldn't finish",{tab:1,note:'undofail'}],['Nothing to undo',{tab:1,undo:false}]]],
 ['AI',[['Not built yet',{tab:2}]]]];
$('.pv__btn').onclick=()=>{const m=$('.pv__menu');if(m){m.remove();return}const d=document.createElement('div');d.className='pv__menu';
 d.innerHTML=`<p>Made-up names.</p>${MENU.map((g,gi)=>`<hr><p><strong>${g[0]}</strong></p>${g[1].map((x,xi)=>`<button type="button" data-g="${gi}" data-x="${xi}">${x[0]}</button>`).join('')}`).join('')}<hr><button type="button" data-a="theme">Switch light and dark</button>`;
 pv.append(d);d.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='theme')toggleTheme();else{const o=MENU[b.dataset.g][1][b.dataset.x][1];$('.scrim')?.remove();saved=fresh();A=o.a?o.a():fresh();
  Object.assign(S,{tab:0,state:'',noCats:false,undo:true,note:'',fail:false},o);delete S.a;openDefault();U.off=o.state==='saving'||o.state==='stale';
  if(o.q){const[k,v]=o.q.split(':');U.q[k]=v}if(o.edit){U.edit=clone(o.edit);if(o.long)U.edit.err=checkName('exp',U.edit.value)}
  render();
  if(o.ask)leave(()=>render(),$('[data-leave]'));if(o.dlg)undo(false);
  const at=o.edit?$('#ge'):o.rm?$('#card-'+o.rm.split(':')[0]):o.a===twelve?$('#card-exp'):o.to?$('#'+o.to):o.q?$('#q-'+o.q.split(':')[0]):o.a===change?$('#h-exp'):null;
  if(at){at.scrollIntoView({block:'center'});if(o.edit)at.focus({preventScroll:true})}
  if(o.rm)askRemove(...o.rm.split(':'))}d.remove()}};
render();
</script>
